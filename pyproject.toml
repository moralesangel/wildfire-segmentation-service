[project]
name = "wildfire-segmentation-service"
version = "0.1.0"
description = "A wildfire segmentation model served under a stated latency budget"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "onnxruntime>=1.18",
    "numpy>=1.26",
    "pillow>=10.3",
    "prometheus-client>=0.20",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]
# Training and ONNX export. Not needed to run the service, which loads a
# checkpoint that is already exported.
train = [
    "torch>=2.2",
    "onnx>=1.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/service"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["onnxruntime.*", "prometheus_client.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"
